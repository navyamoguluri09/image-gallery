<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Modern Image Gallery</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->

  <section class="hero">
    <h1>Creative Image Gallery</h1>
    <p>Modern Responsive Gallery with Lightbox & Filters</p>
  </section>

  <!-- Filter Buttons -->

  <div class="filters">

    <button class="active" data-filter="all">All</button>

    <button data-filter="nature">Nature</button>

    <button data-filter="city">City</button>

    <button data-filter="animals">Animals</button>

  </div>

  <!-- Gallery -->

  <section class="gallery">

    <div class="gallery-item nature">
      <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200&auto=format&fit=crop" alt="">
      <div class="overlay">
        <h3>Nature</h3>
      </div>
    </div>

    <div class="gallery-item city">
      <img src="https://images.unsplash.com/photo-1494526585095-c41746248156?q=80&w=1200&auto=format&fit=crop" alt="">
      <div class="overlay">
        <h3>City</h3>
      </div>
    </div>

    <div class="gallery-item animals">
      <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?q=80&w=1200&auto=format&fit=crop" alt="">
      <div class="overlay">
        <h3>Animals</h3>
      </div>
    </div>

    <div class="gallery-item nature">
      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1200&auto=format&fit=crop" alt="">
      <div class="overlay">
        <h3>Nature</h3>
      </div>
    </div>

    <div class="gallery-item city">
      <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?q=80&w=1200&auto=format&fit=crop" alt="">
      <div class="overlay">
        <h3>City</h3>
      </div>
    </div>

    <div class="gallery-item animals">
      <img src="https://images.unsplash.com/photo-1546182990-dffeafbe841d?q=80&w=1200&auto=format&fit=crop" alt="">
      <div class="overlay">
        <h3>Animals</h3>
      </div>
    </div>

  </section>

  <!-- Lightbox -->

  <div class="lightbox">

    <span class="close">&times;</span>

    <button class="prev">&#10094;</button>

    <img class="lightbox-img" src="" alt="">

    <button class="next">&#10095;</button>

  </div>

  <!-- JS -->
  <script src="script.js"></script>

</body>
</html>
