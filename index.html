<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Hero Section -->
    <section class="hero">

        <h1>Creative Image Gallery</h1>

        <p>
            Explore beautifully crafted moments with immersive
            modern interactions and premium design aesthetics.
        </p>

    </section>

    <!-- Gallery Section -->
    <div class="gallery">

        <div class="image-card">
            <img src="https://picsum.photos/600/400?random=1" alt="Image 1">
        </div>

        <div class="image-card">
            <img src="https://picsum.photos/600/400?random=2" alt="Image 2">
        </div>

        <div class="image-card">
            <img src="https://picsum.photos/600/400?random=3" alt="Image 3">
        </div>

        <div class="image-card">
            <img src="https://picsum.photos/600/400?random=4" alt="Image 4">
        </div>

        <div class="image-card">
            <img src="https://picsum.photos/600/400?random=5" alt="Image 5">
        </div>

        <div class="image-card">
            <img src="https://picsum.photos/600/400?random=6" alt="Image 6">
        </div>

    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">

        <span class="close">&times;</span>

        <img class="lightbox-img" id="lightbox-img">

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
